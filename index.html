<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جدول الاختبارات الاحترافي</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f8f9fa; 
            padding: 40px; 
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h2 { color: #333; text-align: center; margin-bottom: 30px; }
        table.dataTable thead th {
            background-color: #4A90E2;
            color: white;
            border-bottom: none;
            text-align: right;
        }
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📅 جدول الاختبارات النهائية - 2026</h2>
    
    <table id="examTable" class="display nowrap" style="width:100%">
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>الوقت</th>
                <th>الكود</th>
                <th>اسم المادة</th>
                <th>المدة</th>
                <th>الطلاب</th>
            </tr>
        </thead>
        <tbody id="tableContent">
            </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
    // بياناتك (تأكد من وضع القائمة كاملة هنا)
    const data = {
        "exams_list": [
            { "date": "29-03-2026 (Sun)", "time": "09:40 AM - 10:40 AM", "code": "CE 402", "course_name": "Plant Design and Economics", "actual_size": "1", "duration": "01 H 00 M" },
            // ... أضف بقية الـ 117 مادة هنا
        ]
    };

    $(document).ready(function() {
        const tbody = $('#tableContent');
        
        // تعبئة الجدول
        data.exams_list.forEach(exam => {
            tbody.append(`
                <tr>
                    <td>${exam.date}</td>
                    <td>${exam.time}</td>
                    <td><b>${exam.code}</b></td>
                    <td>${exam.course_name}</td>
                    <td>${exam.duration}</td>
                    <td><span style="color: #4A90E2">${exam.actual_size}</span></td>
                </tr>
            `);
        });

        // تشغيل خاصية الجدول الذكي (بحث + ترتيب + تقسيم صفحات)
        $('#examTable').DataTable({
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/ar.json"
            },
            "pageLength": 10, // عرض 10 مواد فقط في كل صفحة
            "order": [[ 0, "asc" ]] // ترتيب حسب التاريخ تلقائياً
        });
    });
</script>

</body>
</html>
