<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Exams - Final Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

    <style>
        :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; --bg: #050816; }
        body { margin: 0; background: var(--bg); font-family: 'Tajawal', sans-serif; color: white; direction: rtl; }
        
        .app { width: min(920px, 96%); margin: 15px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }

        .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 8px; text-align: center; font-weight: bold; font-size: 11px; display: none; }

        .search-wrapper { padding: 20px 15px; text-align: center; }
        .search-wrapper input { width: 100%; max-width: 400px; padding: 12px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 15px; }

        .section-title { padding: 12px 15px 5px; font-size: 13px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px; }

        /* الجدول الكلاسيكي الملموم */
        .table-container { padding: 5px 10px 15px; }
        .table-header { display: flex; padding: 10px 8px; background: rgba(128, 66, 255, 0.15); border-radius: 10px; margin-bottom: 8px; font-size: 10px; font-weight: 800; }
        
        .row { display: flex; align-items: center; padding: 10px 8px; margin-bottom: 6px; background: rgba(255,255,255,0.04); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); }

        .col { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
        .col-code { flex: 1.3; align-items: flex-start; text-align: right; }
        .col-actions { flex: 0.8; flex-direction: row; gap: 5px; justify-content: flex-end; }

        .val-main { font-weight: 800; font-size: 11px; white-space: nowrap; }
        .val-sub { font-size: 8px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        .code-text { color: #ffd166; }
        .time-text { color: var(--danger); }

        .btn-action { border: none; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
        .btn-save { background: rgba(255, 77, 109, 0.1); color: var(--danger); }
        .btn-save.saved { background: var(--danger); color: white; }
        .btn-cal { background: rgba(31, 196, 124, 0.1); color: var(--accent); }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 20px; border-radius: 50px; z-index: 9999; font-weight: bold; font-size: 12px; display: none; }

        @media (max-width: 500px) {
            .val-main { font-size: 10px; }
            .val-sub { display: none; } /* إخفاء اسم المادة الطويل في الجوال لتوفير مساحة */
            .row { padding: 10px 5px; }
            .btn-action { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <main class="app">
        <div id="countdown" class="countdown-bar"></div>

        <div class="search-wrapper">
            <h2 style="margin:0 0 10px 0; font-weight: 900;">جداول YIC</h2>
            <input id="searchInput" type="text" placeholder="ابحث بالرمز (مثال: CS101)..." autocomplete="off">
        </div>

        <div id="mySection" style="display:none;">
            <div class="section-title"><i class="fa fa-star"></i> جدولي المحفوظ</div>
            <div class="table-container">
                <div class="table-header">
                    <div style="flex:1.3; text-align:right;">المادة</div>
                    <div style="flex:1;">التاريخ</div>
                    <div style="flex:1;">الوقت</div>
                    <div style="flex:0.8; text-align:left;">إجراء</div>
                </div>
                <div id="myRows"></div>
            </div>
        </div>

        <div class="section-title"><i class="fa fa-search"></i> نتائج البحث</div>
        <div class="table-container">
            <div id="searchHeader" class="table-header" style="display:none;">
                <div style="flex:1.3; text-align:right;">المادة</div>
                <div style="flex:1;">التاريخ</div>
                <div style="flex:1;">الوقت</div>
                <div style="flex:0.8; text-align:left;">إجراء</div>
            </div>
            <div id="searchRows"></div>
        </div>
    </main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved')) || [];

        // تشغيل عند التحميل
        async function init() {
            try {
                const res = await fetch('exams_data.json?v=' + Date.now());
                const data = await res.json();
                allExams = data.exams_list || [];
                
                syncData(); // تحديث المواعيد المحفوظة لو تغيرت في السيرفر
                renderMySchedule();
            } catch (e) {
                console.error("خطأ في تحميل البيانات");
            }
        }

        // تحديث البيانات المحفوظة تلقائياً لو تغير ملف الـ JSON
        function syncData() {
            let updated = false;
            myExams = myExams.map(savedEx => {
                const latest = allExams.find(e => e.code === savedEx.code);
                if (latest && (latest.date !== savedEx.date || latest.time !== savedEx.time)) {
                    updated = true;
                    return latest;
                }
                return savedEx;
            });
            if (updated) {
                localStorage.setItem('yic_saved', JSON.stringify(myExams));
                showToast("🔔 تم تحديث مواعيد في جدولك");
            }
        }

        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('mySection');
            
            if (myExams.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';
            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            
            // تحديث العد التنازلي لأول مادة
            updateCountdown(myExams[0]);
        }

        function createRow(ex, isSaved) {
            const div = document.createElement('div');
            div.className = 'row';
            div.innerHTML = `
                <div class="col col-code">
                    <span class="val-main code-text">${ex.code}</span>
                    <span class="val-sub">${ex.course_name || ''}</span>
                </div>
                <div class="col">
                    <span class="val-main">${ex.date}</span>
                </div>
                <div class="col">
                    <span class="val-main time-text">${ex.time}</span>
                </div>
                <div class="col col-actions">
                    <button class="btn-action btn-cal" onclick="addToCal('${ex.code}','${ex.date}')"><i class="fa fa-calendar-plus"></i></button>
                    <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')">
                        <i class="fa ${isSaved ? 'fa-trash-can' : 'fa-bookmark'}"></i>
                    </button>
                </div>
            `;
            return div;
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) {
                myExams.splice(index, 1);
            } else {
                const exam = allExams.find(e => e.code === code);
                if (exam) myExams.push(exam);
            }
            localStorage.setItem('yic_saved', JSON.stringify(myExams));
            renderMySchedule();
            doSearch(); // لتحديث أيقونة الحفظ في نتائج البحث
        }

        function doSearch() {
            const q = document.getElementById('searchInput').value.trim().toUpperCase();
            const container = document.getElementById('searchRows');
            const header = document.getElementById('searchHeader');

            if (!q) {
                container.innerHTML = '';
                header.style.display = 'none';
                return;
            }

            const filtered = allExams.filter(e => e.code.toUpperCase().includes(q) || (e.course_name && e.course_name.toUpperCase().includes(q)));
            
            container.innerHTML = '';
            if (filtered.length > 0) {
                header.style.display = 'flex';
                filtered.forEach(ex => {
                    const isSaved = myExams.some(s => s.code === ex.code);
                    container.appendChild(createRow(ex, isSaved));
                });
            } else {
                header.style.display = 'none';
                container.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">لا توجد نتائج</div>';
            }
        }

        function updateCountdown(ex) {
            const el = document.getElementById('countdown');
            // محاولة بسيطة لفهم التاريخ (يفترض DD-MM-YYYY)
            const parts = ex.date.split('-');
            if (parts.length !== 3) return;
            const targetDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays >= 0) {
                el.style.display = 'block';
                el.innerHTML = diffDays === 0 ? "🔥 اختبارك اليوم! بالتوفيق" : `🚀 متبقي ${diffDays} أيام على اختبار ${ex.code}`;
            } else {
                el.style.display = 'none';
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function addToCal(code, date) {
            const parts = date.split('-');
            const fmtDate = `${parts[2]}${parts[1]}${parts[0]}`;
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=اختبار ${code}&dates=${fmtDate}T080000/${fmtDate}T100000`, '_blank');
        }

        document.getElementById('searchInput').addEventListener('input', doSearch);
        init();
    </script>
</body>
</html>
