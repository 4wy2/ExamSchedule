<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

    <style>
        :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; }
        body { margin: 0; background: #050816; font-family: 'Tajawal', sans-serif; color: white; overflow-x: hidden; }
        
        .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .app { width: min(920px, 95%); margin: 20px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 12px; text-align: center; font-weight: bold; display: none; font-size: 14px; }

        .section-title { padding: 15px 20px 5px; font-size: 14px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

        .row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.6fr 0.8fr; gap: 10px; padding: 15px; margin: 10px 15px; background: rgba(255,255,255,0.03); border-radius: 15px; align-items: center; border: 1px solid transparent; transition: 0.3s; animation: fadeIn 0.4s ease-out; }
        .row:hover { background: rgba(255,255,255,0.07); border-color: var(--primary); transform: scale(1.01); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-action { border: none; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-save { background: rgba(128, 66, 255, 0.1); color: #b794ff; border: 1px solid rgba(128, 66, 255, 0.3); }
        .btn-save.saved { background: var(--danger); color: white; border: none; }
        .btn-cal { background: rgba(31, 196, 124, 0.1); color: var(--accent); border: 1px solid rgba(31, 196, 124, 0.3); }

        .search-wrapper { padding: 30px 20px; text-align: center; }
        .search-wrapper input { width: 100%; max-width: 450px; padding: 15px 25px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; font-family: inherit; font-size: 16px; transition: 0.3s; }
        .search-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(128, 66, 255, 0.3); }

        .badge { font-size: 10px; padding: 2px 8px; border-radius: 5px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05); }
        
        @media (max-width: 600px) {
            .row { grid-template-columns: 1.2fr 1fr 0.5fr; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob" style="width:400px; height:400px; background:var(--primary); top:-100px; right:-100px;"></div>
        <div class="blob" style="width:300px; height:300px; background:var(--accent); bottom:-50px; left:-50px;"></div>
    </div>

    <main class="app">
        <div id="countdown" class="countdown-bar"></div>

        <div class="search-wrapper">
            <h2 style="margin-bottom: 10px; font-weight: 900; letter-spacing: -1px;">جداول YIC الذكية <span class="badge">PRO</span></h2>
            <p style="opacity: 0.5; font-size: 13px; margin-bottom: 20px;">ابحث عن مادتك واحفظها في جدولك الشخصي</p>
            <input id="studentId" type="text" placeholder="ابحث بالرمز أو الاسم (مثال: GSMA101)...">
        </div>

        <div id="myScheduleSection" style="display:none;">
            <div class="section-title"><i class="fa fa-star" style="color: #ffd166;"></i> جدولي الشخصي المختار</div>
            <div id="myRows"></div>
        </div>

        <div class="section-title"><i class="fa fa-search"></i> نتائج البحث</div>
        <div id="searchRows">
            <div style="text-align: center; padding: 60px; opacity: 0.3;">
                <i class="fa fa-terminal" style="font-size: 30px; margin-bottom: 10px;"></i>
                <div style="font-size: 14px;">ابدأ الكتابة للبحث عن الاختبارات...</div>
            </div>
        </div>
    </main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_exams')) || [];

        async function init() {
            try {
                const res = await fetch('exams_data.json');
                const data = await res.json();
                allExams = data.exams_list;
                renderMySchedule();
            } catch(e) { 
                console.error("Data load error:", e);
                document.getElementById('searchRows').innerHTML = '<div style="text-align:center; padding:20px; color:var(--danger)">فشل تحميل البيانات. تأكد من وجود ملف الـ JSON</div>';
            }
        }

        // تحسين: ترتيب الجدول حسب التاريخ الأقرب
        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('myScheduleSection');
            const countdownEl = document.getElementById('countdown');
            
            if (myExams.length === 0) { 
                section.style.display = 'none'; 
                countdownEl.style.display = 'none';
                return; 
            }

            // ترتيب المواعيد زمنياً
            myExams.sort((a, b) => {
                const dateA = a.date.split(' ')[0].split('-').reverse().join('');
                const dateB = b.date.split(' ')[0].split('-').reverse().join('');
                return dateA.localeCompare(dateB);
            });

            section.style.display = 'block';
            container.innerHTML = '';
            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            
            updateCountdown(myExams[0].date);
        }

        function createRow(ex, isSaved) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div>
                    <div style="font-weight:800; color:#ffd166; font-size:15px;">${ex.code}</div>
                    <div style="font-size:11px; opacity:0.6; margin-top:2px;">${ex.course_name}</div>
                </div>
                <div style="text-align:center">
                    <div style="font-size:13px; font-weight:bold;">${ex.date.split(' ')[0]}</div>
                    <div style="font-size:11px; color:var(--accent)">${ex.date.split(' ')[1] || ''}</div>
                </div>
                <div class="hide-mobile">
                    <div style="font-size:12px; color:var(--danger); font-weight:bold;">${ex.time}</div>
                </div>
                <div class="hide-mobile badge" style="text-align:center; align-self:center; justify-self:center;">${ex.duration}</div>
                <div style="display:flex; gap:8px; justify-content:flex-end">
                    <button class="btn-action btn-cal" onclick="addToCal('${ex.code}','${ex.date}','${ex.time}')" title="إضافة للتقويم">
                        <i class="fa fa-calendar-plus"></i>
                    </button>
                    <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')" title="${isSaved ? 'حذف من جدولي' : 'حفظ في جدولي'}">
                        <i class="fa ${isSaved ? 'fa-trash-can' : 'fa-bookmark'}"></i>
                    </button>
                </div>
            `;
            return row;
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) {
                myExams.splice(index, 1);
            } else {
                const exam = allExams.find(e => e.code === code);
                if(exam) myExams.push(exam);
            }
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
            renderMySchedule();
            doSearch();
        }

        // تحسين: بحث ذكي يتجاهل المسافات وحالة الأحرف
        function doSearch() {
            const qRaw = document.getElementById('studentId').value;
            const qClean = qRaw.trim().toUpperCase().replace(/\s+/g, '');
            const container = document.getElementById('searchRows');
            
            if (!qClean) { 
                container.innerHTML = '<div style="text-align: center; padding: 60px; opacity: 0.3;"><i class="fa fa-terminal" style="font-size: 30px; margin-bottom: 10px;"></i><div style="font-size: 14px;">ابدأ الكتابة للبحث عن الاختبارات...</div></div>';
                return; 
            }

            const filtered = allExams.filter(e => {
                const cleanCode = e.code.toUpperCase().replace(/\s+/g, '');
                const cleanName = e.course_name.toUpperCase().replace(/\s+/g, '');
                return cleanCode.includes(qClean) || cleanName.includes(qClean);
            });

            container.innerHTML = '';
            if(filtered.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; opacity: 0.5;">لا توجد نتائج تطابق بحثك...</div>';
                return;
            }

            filtered.forEach(ex => {
                const isSaved = myExams.some(s => s.code === ex.code);
                container.appendChild(createRow(ex, isSaved));
            });
        }

        function updateCountdown(dateStr) {
            const datePart = dateStr.split(' ')[0];
            const [d, m, y] = datePart.split('-');
            const diff = dayjs(`${y}-${m}-${d}`).diff(dayjs().startOf('day'), 'day');
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            
            if (diff > 0) {
                el.innerHTML = `🚀 متبقي ${diff} أيام على اختبارك القادم (${datePart})`;
            } else if (diff === 0) {
                el.innerHTML = `🔥 اختبارك اليوم! كل التوفيق لك (${datePart})`;
            } else {
                el.innerHTML = `✅ انتهت الاختبارات المحددة في جدولك`;
            }
        }

        // تحسين: دالة التقويم تضبط الوقت بدقة
        function addToCal(code, dateStr, timeStr) {
            const d = dateStr.split(' ')[0].split('-').reverse().join('');
            let startTime = "080000"; 
            
            if(timeStr && timeStr.includes(':')) {
                // تنظيف الوقت من AM/PM واستخراج الأرقام فقط
                const t = timeStr.split(' ')[0].replace(':', '');
                startTime = t.padStart(4, '0') + "00";
            }

            const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=اختبار ${code}&dates=${d}T${startTime}/${d}T${parseInt(startTime)+20000}&details=نظام YIC الذكي يتمنى لكم التوفيق&sf=true&output=xml`;
            window.open(googleUrl, '_blank');
        }

        document.getElementById('studentId').addEventListener('input', doSearch);
        init();
    </script>
</body>
</html>
