<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/plugin/customParseFormat.min.js"></script>
    <script>dayjs.extend(window.dayjs_plugin_customParseFormat);</script>

    <style>
    :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; --bg: #050816; }
    body { margin: 0; background: var(--bg); font-family: 'Tajawal', sans-serif; color: white; overflow-x: hidden; }
    
    .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
    .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.1; animation: move 20s infinite alternate; }
    @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }
    
    .app { width: min(950px, 95%); margin: 30px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.6); min-height: 500px; }
    .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 15px; text-align: center; font-weight: 800; display: none; }
    
    .search-wrapper { padding: 40px 20px; text-align: center; }
    .search-wrapper input { width: 100%; max-width: 500px; padding: 18px 30px; border-radius: 50px; border: 2px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.4); color: white; outline: none; font-size: 16px; transition: 0.3s; }
    .search-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(128, 66, 255, 0.3); }

    .section-title { padding: 25px 25px 10px; font-size: 14px; color: var(--primary); font-weight: 900; display: flex; align-items: center; gap: 12px; }

    /* تنسيق الجدول للكمبيوتر */
    .table-header { 
        display: grid; 
        grid-template-columns: 1.5fr 1fr 1fr 0.6fr 0.4fr; 
        gap: 10px; padding: 12px 25px; background: rgba(255,255,255,0.05); margin: 10px 15px; border-radius: 12px; font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.4); align-items: center; text-align: center;
    }
    .table-header div:first-child { text-align: right; }
    .table-header div:last-child { text-align: left; }

    .row {
        display: grid; grid-template-columns: 1.5fr 1fr 1fr 0.6fr 0.4fr; gap: 10px; align-items: center; padding: 15px 25px; margin: 8px 15px; background: rgba(255,255,255,0.03); border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; text-align: center;
    }
    .row:hover { background: rgba(255,255,255,0.06); border-color: var(--primary); }

    .btn-action { border: none; width: 42px; height: 42px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; background: rgba(128, 66, 255, 0.1); color: #b794ff; }
    .btn-save.saved { background: var(--danger); color: white; }

    /* تنسيق الجوال السحري - هنا الضمان! */
    @media (max-width: 768px) {
        .table-header { display: none; }
        .row { 
            grid-template-columns: 1fr auto; /* معلومات على اليمين وزر على اليسار */
            gap: 5px; padding: 15px; text-align: right;
        }
        .info-group { grid-column: 1; }
        .date-box { grid-column: 1; justify-content: flex-start !important; }
        .time-box { grid-column: 1; justify-content: flex-start !important; margin: 5px 0; }
        .duration-box { grid-column: 1; text-align: right !important; opacity: 0.8; }
        .actions { grid-column: 2; grid-row: 1 / span 4; align-self: center; }
        
        .row .label { font-size: 15px !important; }
        .time-box div { padding: 4px 10px !important; background: rgba(255,255,255,0.05) !important; display: inline-block !important; }
    }
</style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob" style="width:500px; height:500px; background:var(--primary); top:-150px; right:-100px;"></div>
        <div class="blob" style="width:400px; height:400px; background:var(--accent); bottom:-100px; left:-50px;"></div>
    </div>

   <main class="app">
    <div id="countdown" class="countdown-bar"></div>
    
    <div class="search-wrapper">
        <h2 style="letter-spacing: -1px;">جداول YIC الذكية <span style="font-size: 10px; background: var(--primary); padding: 3px 10px; border-radius: 8px; vertical-align: middle;">PRO</span></h2>
        <input id="searchInput" type="text" placeholder="ابحث برمز المادة أو اسمها (مثلاً: MATH)...">
    </div>

    <div id="myScheduleSection" style="display:none; margin-bottom: 20px;">
        <div class="section-title">
            <i class="fa-solid fa-star-half-stroke" style="color:#ffd166"></i> 
            جدولك الشخصي
        </div>
        <div class="table-header">
            <div>المادة</div><div>التاريخ</div><div>الوقت</div><div>المدة</div><div>حفظ</div>
        </div>
        <div id="myRows"></div>
    </div>

    <div class="section-title">
        <i class="fa-solid fa-magnifying-glass"></i> 
        نتائج البحث
    </div>
    <div id="searchHeader" class="table-header" style="display:none;">
        <div>المادة</div><div>التاريخ</div><div>الوقت</div><div>المدة</div><div>حفظ</div>
    </div>
    <div id="searchRows">
        <div style="text-align: center; padding: 60px; opacity: 0.3;">
            <i class="fa-solid fa-keyboard" style="display: block; font-size: 30px; margin-bottom: 10px;"></i>
            ابدأ البحث الآن عن اختبارك
        </div>
    </div>
</main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_exams')) || [];

        async function loadData() {
            try {
                const response = await fetch('exams_data.json');
                if (!response.ok) throw new Error('الملف غير موجود');
                const data = await response.json();
                allExams = data.exams_list;
                renderMySchedule();
                document.getElementById('searchRows').innerHTML = '<div style="text-align: center; padding: 60px; opacity: 0.3;">ابدأ البحث الآن عن اختبارك</div>';
            } catch (error) {
                document.getElementById('searchRows').innerHTML = '<div style="text-align: center; padding: 60px; color: var(--danger);">تأكد من وجود ملف exams_data.json</div>';
            }
        }

        function createRow(ex, isSaved) {
    const row = document.createElement('div');
    row.className = 'row';
    
    const dateParts = ex.date.split(' ');
    const dateNum = dateParts[0];
    const dayName = dateParts[1] ? dateParts[1].replace(/[()]/g, '') : '';
    const timeParts = ex.time.split('-');
    const startTime = timeParts[0] ? timeParts[0].trim() : ex.time;
    const endTime = timeParts[1] ? timeParts[1].trim() : '';
    const isPM = ex.time.toUpperCase().includes('PM');
    const timeColor = isPM ? '#ff9f43' : '#00d2d3';

    row.innerHTML = `
        <div class="info-group" style="text-align: right;">
            <span class="label" style="color: #ffd166; font-size: 16px; font-weight: 900; display: block;">${ex.code}</span>
            <span class="sub" style="font-size: 10px; opacity: 0.5; font-weight: 300;">${ex.course_name}</span>
        </div>

        <div class="date-box" style="display: flex; justify-content: center; align-items: center; gap: 8px;">
            <div style="text-align: left;">
                <b style="display: block; font-size: 14px; color: #fff;">${dateNum}</b>
                <small style="font-size: 10px; color: var(--accent); font-weight: 800; display: block; text-align: right;">${dayName}</small>
            </div>
            <div style="width: 3px; height: 26px; background: var(--accent); border-radius: 2px;"></div>
        </div>

        <div class="time-box" style="display: flex; justify-content: center;">
            <div style="text-align: center; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); min-width: 85px;">
                <div style="font-size: 13px; font-weight: 800; color: ${timeColor};">${startTime}</div>
                ${endTime ? `<div style="font-size: 9px; opacity: 0.3;">${endTime}</div>` : ''}
            </div>
        </div>

        <div class="duration-box" style="text-align: center;">
            <span style="font-size: 12px; font-weight: 600; display: block; color: #eee;">
                ${ex.duration.replace(' H ', 'س ').replace(' M', 'د')}
            </span>
            <span style="font-size: 9px; opacity: 0.4;">
                <i class="fa-solid fa-users" style="font-size: 7px;"></i> ${ex.actual_size}
            </span>
        </div>

        <div class="actions">
            <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')">
                <i class="fa-solid ${isSaved ? 'fa-xmark' : 'fa-plus'}"></i>
            </button>
        </div>
    `;
    return row;
}
        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('myScheduleSection');
            if (myExams.length === 0) { section.style.display = 'none'; return; }

            section.style.display = 'block';
            container.innerHTML = '';
            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            updateCountdown(myExams[0].date);
        }

        function doSearch() {
            // معالجة نص البحث: تحويل لصغير وإزالة كل المسافات
            const q = document.getElementById('searchInput').value.toLowerCase().replace(/\s+/g, '');
            const container = document.getElementById('searchRows');
            const header = document.getElementById('searchHeader');
            
            if (!q) {
                container.innerHTML = '<div style="text-align: center; padding: 60px; opacity: 0.3;">ابدأ البحث الآن عن اختبارك</div>';
                header.style.display = 'none';
                return;
            }

            const filtered = allExams.filter(e => {
                const codeSafe = e.code.toLowerCase().replace(/\s+/g, '');
                const nameSafe = e.course_name.toLowerCase().replace(/\s+/g, '');
                return codeSafe.includes(q) || nameSafe.includes(q);
            });

            container.innerHTML = '';
            if (filtered.length > 0) {
                header.style.display = 'grid';
                filtered.forEach(ex => {
                    const isSaved = myExams.some(s => s.code === ex.code);
                    container.appendChild(createRow(ex, isSaved));
                });
            } else {
                header.style.display = 'none';
                container.innerHTML = '<div style="text-align: center; padding: 40px; opacity: 0.5;">لا توجد نتائج مطابقة</div>';
            }
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) myExams.splice(index, 1);
            else {
                const exam = allExams.find(e => e.code === code);
                if (exam) myExams.push(exam);
            }
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
            renderMySchedule();
            doSearch();
        }

        function updateCountdown(dateStr) {
            const target = dayjs(dateStr.split(' ')[0], 'DD-MM-YYYY');
            const diff = target.diff(dayjs().startOf('day'), 'day');
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            if (diff > 0) el.innerText = `🚀 متبقي ${diff} أيام على اختبارك القادم (${dateStr.split(' ')[0]})`;
            else if (diff === 0) el.innerText = `🔥 اختبارك اليوم! فالك التوفيق`;
            else el.innerText = `✅ انتهت الاختبارات المضافة`;
        }

        document.getElementById('searchInput').addEventListener('input', doSearch);
        window.onload = loadData;
    </script>
</body>
</html>
