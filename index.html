<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

    <style>
        :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; }
        body { margin: 0; background: #050816; font-family: 'Tajawal', sans-serif; color: white; overflow-x: hidden; }
        
        .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .app { width: min(920px, 95%); margin: 20px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 12px; text-align: center; font-weight: bold; display: none; font-size: 13px; }

        .section-title { padding: 15px 20px 5px; font-size: 14px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

        /* تصميم الصف الأفقي المتجاوب */
        .row { 
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 15px; 
            margin: 10px 15px; 
            background: rgba(255,255,255,0.03); 
            border-radius: 15px; 
            border: 1px solid transparent; 
            transition: 0.3s; 
            gap: 10px;
        }
        .row:hover { background: rgba(255,255,255,0.07); border-color: var(--primary); }

        .data-item { display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; min-width: 0; }
        .caption { font-size: 9px; color: #5d78ff; font-weight: bold; margin-bottom: 4px; opacity: 0.8; }
        
        .info-group { flex: 1.5; align-items: flex-start; text-align: right; }
        .course-code { font-weight: 800; color: #ffd166; font-size: 14px; }
        .val-text { font-weight: bold; font-size: 12px; white-space: nowrap; }

        .btn-action { border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-save { background: rgba(128, 66, 255, 0.1); color: #b794ff; border: 1px solid rgba(128, 66, 255, 0.3); }
        .btn-save.saved { background: var(--danger); color: white; border: none; }
        .btn-cal { background: rgba(31, 196, 124, 0.1); color: var(--accent); border: 1px solid rgba(31, 196, 124, 0.3); }

        .search-wrapper { padding: 30px 20px; text-align: center; }
        .search-wrapper input { width: 100%; max-width: 450px; padding: 14px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 15px; }

        /* تنبيه التحديث */
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 12px 20px;
            border-radius: 50px; z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-weight: bold; font-size: 13px; display: none; animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }

        @media (max-width: 600px) {
            .row { padding: 10px 8px; gap: 4px; margin: 8px 10px; }
            .val-text { font-size: 11px; }
            .caption { font-size: 8px; }
            .hide-mobile { display: none; }
            .actions-cell { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>

    <div id="updateToast" class="toast"></div>

    <div class="bg-blobs">
        <div class="blob" style="width:400px; height:400px; background:var(--primary); top:-100px; right:-100px;"></div>
        <div class="blob" style="width:300px; height:300px; background:var(--accent); bottom:-50px; left:-50px;"></div>
    </div>

    <main class="app">
        <div id="countdown" class="countdown-bar"></div>

        <div class="search-wrapper">
            <h2 style="margin-bottom: 5px; font-weight: 900;">جداول YIC الذكية</h2>
            <p style="font-size: 12px; opacity: 0.6; margin-bottom: 15px;">سيتم تحديث جدولك تلقائياً عند تغيير المواعيد</p>
            <input id="studentId" type="text" placeholder="ابحث بالرمز أو الاسم...">
        </div>

        <div id="myScheduleSection" style="display:none;">
            <div class="section-title"><i class="fa fa-star" style="color: #ffd166;"></i> جدولي الشخصي</div>
            <div id="myRows"></div>
        </div>

        <div class="section-title"><i class="fa fa-search"></i> نتائج البحث</div>
        <div id="searchRows"></div>
    </main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_exams')) || [];

        async function init() {
            try {
                // v=Date.now تجبر المتصفح على تحميل أحدث ملف JSON بدون كاش
                const res = await fetch('exams_data.json?v=' + Date.now());
                const data = await res.json();
                allExams = data.exams_list;

                syncData(); // فحص التحديثات للمواد المحفوظة
                renderMySchedule();
            } catch(e) { console.error("Load Error:", e); }
        }

        // دالة المزامنة والتنبيه
        function syncData() {
            let hasUpdate = false;
            myExams = myExams.map(savedEx => {
                const latest = allExams.find(e => e.code === savedEx.code);
                if (latest && (latest.date !== savedEx.date || latest.time !== savedEx.time)) {
                    hasUpdate = true;
                    return latest; // تحديث البيانات القديمة بالجديدة
                }
                return savedEx;
            });

            if (hasUpdate) {
                localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
                showToast("🔔 تم تحديث مواعيد في جدولك الشخصي");
            }
        }

        function showToast(msg) {
            const t = document.getElementById('updateToast');
            t.innerHTML = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 5000);
        }

        function createRow(ex, isSaved) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div class="data-item info-group">
                    <div class="caption">المادة</div>
                    <div class="course-code">${ex.code}</div>
                    <div style="font-size:9px; opacity:0.5; white-space:nowrap;">${ex.course_name}</div>
                </div>
                <div class="data-item">
                    <div class="caption">التاريخ</div>
                    <div class="val-text">${ex.date.split(' ')[0]}</div>
                    <div style="font-size:9px; color:var(--accent)">${ex.date.split(' ')[1] || ''}</div>
                </div>
                <div class="data-item">
                    <div class="caption">الوقت</div>
                    <div class="val-text" style="color:var(--danger)">${ex.time}</div>
                </div>
                <div class="data-item hide-mobile">
                    <div class="caption">المدة</div>
                    <div style="font-size:10px; background:rgba(255,255,255,0.1); padding:2px 5px; border-radius:4px;">${ex.duration}</div>
                </div>
                <div class="actions-cell" style="display:flex; gap:6px;">
                    <button class="btn-action btn-cal" onclick="addToCal('${ex.code}','${ex.date}','${ex.time}')"><i class="fa fa-calendar-plus"></i></button>
                    <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')"><i class="fa ${isSaved ? 'fa-trash-can' : 'fa-bookmark'}"></i></button>
                </div>
            `;
            return row;
        }

        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('myScheduleSection');
            if (myExams.length === 0) { section.style.display = 'none'; return; }

            myExams.sort((a, b) => {
                const dateA = a.date.split(' ')[0].split('-').reverse().join('');
                const dateB = b.date.split(' ')[0].split('-').reverse().join('');
                return dateA.localeCompare(dateB);
            });

            section.style.display = 'block';
            container.innerHTML = '';
            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            updateCountdown(myExams[0].date);
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) myExams.splice(index, 1);
            else {
                const exam = allExams.find(e => e.code === code);
                if(exam) myExams.push(exam);
            }
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
            renderMySchedule();
            doSearch();
        }

        function doSearch() {
            const q = document.getElementById('studentId').value.trim().toUpperCase().replace(/\s+/g, '');
            const container = document.getElementById('searchRows');
            if (!q) { container.innerHTML = ''; return; }
            const filtered = allExams.filter(e => e.code.toUpperCase().replace(/\s+/g, '').includes(q) || e.course_name.toUpperCase().replace(/\s+/g, '').includes(q));
            container.innerHTML = '';
            filtered.forEach(ex => container.appendChild(createRow(ex, myExams.some(s => s.code === ex.code))));
        }

        function updateCountdown(dateStr) {
            const datePart = dateStr.split(' ')[0];
            const [d, m, y] = datePart.split('-');
            const diff = dayjs(`${y}-${m}-${d}`).diff(dayjs().startOf('day'), 'day');
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            if (diff > 0) el.innerHTML = `🚀 متبقي ${diff} أيام على اختبارك القادم (${datePart})`;
            else if (diff === 0) el.innerHTML = `🔥 اختبارك اليوم! بالتوفيق (${datePart})`;
            else el.style.display = 'none';
        }

        function addToCal(code, dateStr, timeStr) {
            const d = dateStr.split(' ')[0].split('-').reverse().join('');
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=اختبار ${code}&dates=${d}T080000/${d}T100000`, '_blank');
        }

        document.getElementById('studentId').addEventListener('input', doSearch);
        init();
    </script>
</body>
</html>
