<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

    <style>
        :root { 
            --primary: #8042ff; 
            --accent: #1fc47c; 
            --danger: #ff4d6d; 
            --bg: #050816; 
            --card-bg: #0d1738; /* لون البطاقة من تصميمك */
        }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            font-family: 'Tajawal', sans-serif; 
            color: white; 
            padding: 10px;
        }

        .app { 
            max-width: 1000px; 
            margin: auto; 
        }

        .section-title { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 15px 5px; 
            font-size: 18px; 
            font-weight: 900; 
            color: #b794ff;
        }

        /* حاوية الصف - مصممة لتكون "جدول مرن" في الجوال */
        .row { 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between;
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 12px 8px; 
            margin-bottom: 12px; 
            border: 1px solid rgba(255,255,255,0.05);
            gap: 5px; /* تقليل المسافات ليناسب الشاشة */
        }

        /* كل عمود بيانات */
        .data-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1; /* توزيع متساوي */
            min-width: 0; /* لمنع خروج النص */
        }

        /* العناوين التوضيحية (الزرقاء في صورتك) */
        .caption {
            font-size: 10px;
            color: #5d78ff; /* لون العناوين التوضيحية */
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        /* القيم الأساسية */
        .value {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        /* تمييز المادة باللون الأصفر */
        .course-code { color: #ffd166; font-size: 14px; }
        
        /* تمييز الوقت باللون الأحمر/الوردي */
        .time-value { color: var(--danger); font-size: 12px; }

        /* عمود الأزرار */
        .actions {
            display: flex;
            gap: 5px;
            padding-right: 5px;
        }

        .btn-action {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-del { background: #ff4d6d; color: white; }
        .btn-cal { background: #1a2c38; color: #1fc47c; border: 1px solid #1fc47c; }

        /* لمسة إضافية للشاشات الصغيرة جداً */
        @media (max-width: 400px) {
            .value { font-size: 11px; }
            .caption { font-size: 9px; }
            .btn-action { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <main class="app">
        <div class="section-title">
             <i class="fa fa-star" style="color:#ffd166"></i> جدولي الشخصي
        </div>

        <div id="scheduleContainer">
            <div class="row">
                <div class="data-column" style="flex: 1.2;">
                    <div class="caption">المادة</div>
                    <div class="value course-code">EE 301</div>
                </div>

                <div class="data-column">
                    <div class="caption">التاريخ</div>
                    <div class="value">17-02-2026</div>
                    <div class="value" style="font-size: 9px; color: var(--accent);">(Sun)</div>
                </div>

                <div class="data-column" style="flex: 1.5;">
                    <div class="caption">الوقت</div>
                    <div class="value time-value">09:40 AM</div>
                    <div class="value time-value" style="font-size: 9px; opacity: 0.7;">10:40 AM</div>
                </div>

                <div class="data-column">
                    <div class="caption">المدة</div>
                    <div class="value">1 H 30 M</div>
                </div>

                <div class="actions">
                    <button class="btn-action btn-cal"><i class="fa fa-calendar-plus"></i></button>
                    <button class="btn-action btn-del"><i class="fa fa-trash"></i></button>
                </div>
            </div>
            
            <div class="row">
                <div class="data-column" style="flex: 1.2;"><div class="caption">المادة</div><div class="value course-code">GSMA101</div></div>
                <div class="data-column">
                    <div class="caption">التاريخ</div>
                    <div class="value">29-03-2026</div>
                    <div class="value" style="font-size: 9px; color: var(--accent);">(Sun)</div>
                </div>
                <div class="data-column" style="flex: 1.5;"><div class="caption">الوقت</div><div class="value time-value">09:40 AM</div><div class="value time-value" style="font-size: 9px; opacity: 0.7;">10:40 AM</div></div>
                <div class="data-column"><div class="caption">المدة</div><div class="value">1 H 30 M</div></div>
                <div class="actions">
                    <button class="btn-action btn-cal"><i class="fa fa-calendar-plus"></i></button>
                    <button class="btn-action btn-del"><i class="fa fa-trash"></i></button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
