<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; }
        body { margin: 0; background: #050816; font-family: 'Tajawal', sans-serif; color: white; min-height: 100vh; }
        
        .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .app { width: min(920px, 95%); margin: 20px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; overflow: hidden; padding-bottom: 20px; }

        .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 12px; text-align: center; font-weight: bold; display: none; font-size: 14px; }

        .section-title { padding: 15px 20px 5px; font-size: 14px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

        .row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.6fr 0.8fr; gap: 10px; padding: 15px; margin: 10px 15px; background: rgba(255,255,255,0.03); border-radius: 15px; align-items: center; border: 1px solid transparent; transition: 0.3s; }
        .row:hover { background: rgba(255,255,255,0.07); border-color: var(--primary); }

        .btn-action { border: none; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-save { background: rgba(128, 66, 255, 0.2); color: #b794ff; }
        .btn-save.saved { background: var(--primary); color: white; }
        .btn-cal { background: rgba(31, 196, 124, 0.2); color: var(--accent); }
        .btn-download { background: #ffffff10; color: white; border: 1px solid #ffffff20; margin-right: auto; padding: 5px 15px; }

        .search-wrapper { padding: 20px; text-align: center; }
        .search-wrapper input { width: 100%; max-width: 400px; padding: 12px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none; font-family: inherit; }

        .badge { font-size: 10px; padding: 2px 8px; border-radius: 5px; background: rgba(255,255,255,0.1); white-space: nowrap; }
        
        @media (max-width: 600px) {
            .row { grid-template-columns: 1.2fr 1fr 0.5fr; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob" style="width:400px; height:400px; background:var(--primary); top:-100px; right:-100px;"></div>
        <div class="blob" style="width:300px; height:300px; background:var(--accent); bottom:-50px; left:-50px;"></div>
    </div>

    <main class="app">
        <div id="countdown" class="countdown-bar"></div>

        <div class="search-wrapper">
            <h2 style="margin-bottom: 5px; font-weight: 900;">جداول YIC الذكية</h2>
            <p style="font-size: 11px; opacity: 0.5; margin-bottom: 20px;">ابحث عن موادك وخصص جدولك بضغطة زر</p>
            <input id="studentId" type="text" placeholder="ابحث برمز المادة أو اسمها...">
        </div>

        <div id="myScheduleSection" style="display:none;">
            <div class="section-title">
                <i class="fa fa-star"></i> جدولي الشخصي
                <button class="btn-action btn-download" onclick="downloadSchedule()">
                    <i class="fa fa-camera"></i> حفظ كصورة
                </button>
            </div>
            <div id="myRows"></div>
        </div>

        <div class="section-title"><i class="fa fa-search"></i> نتائج البحث</div>
        <div id="searchRows">
            <div style="text-align: center; padding: 40px; opacity: 0.4;">ابدأ الكتابة للبحث في 117 مادة...</div>
        </div>
    </main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_exams')) || [];

        async function init() {
            try {
                const res = await fetch('exams_data.json');
                const data = await res.json();
                allExams = data.exams_list;
                renderMySchedule();
            } catch (err) { console.error("Data error"); }
        }

        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('myScheduleSection');
            
            if (myExams.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';
            
            // ترتيب الجدول الشخصي حسب التاريخ
            myExams.sort((a, b) => {
                const dA = a.date.split(' ')[0].split('-').reverse().join('');
                const dB = b.date.split(' ')[0].split('-').reverse().join('');
                return dA.localeCompare(dB);
            });

            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            updateCountdown(myExams[0].date);
        }

        function createRow(ex, isSaved) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div>
                    <div style="font-weight:800; color:#ffd166">${ex.code}</div>
                    <div style="font-size:11px; opacity:0.6; line-height:1.2">${ex.course_name}</div>
                </div>
                <div style="text-align:center">
                    <div style="font-size:13px">${ex.date.split(' ')[0]}</div>
                    <div style="font-size:11px; color:var(--accent)">${ex.date.split(' ')[1] || ''}</div>
                </div>
                <div class="hide-mobile">
                    <div style="font-size:12px; color:var(--danger)">${ex.time}</div>
                </div>
                <div class="hide-mobile badge" style="text-align:center">${ex.duration}</div>
                <div style="display:flex; gap:5px; justify-content:flex-end">
                    <button class="btn-action btn-cal" title="إضافة للتقويم" onclick="addToCal('${ex.code}','${ex.date}','${ex.time}')"><i class="fa fa-calendar-plus"></i></button>
                    <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')">
                        <i class="fa ${isSaved ? 'fa-trash' : 'fa-plus'}"></i>
                    </button>
                </div>
            `;
            return row;
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) {
                myExams.splice(index, 1);
            } else {
                const exam = allExams.find(e => e.code === code);
                myExams.push(exam);
            }
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
            renderMySchedule();
            doSearch();
        }

        function doSearch() {
            const q = document.getElementById('studentId').value.trim().toUpperCase();
            const container = document.getElementById('searchRows');
            if (!q) { 
                container.innerHTML = '<div style="text-align: center; padding: 40px; opacity: 0.4;">ابدأ الكتابة للبحث في 117 مادة...</div>';
                return; 
            }

            const filtered = allExams.filter(e => e.code.includes(q) || e.course_name.toUpperCase().includes(q));
            container.innerHTML = '';
            filtered.forEach(ex => {
                const isSaved = myExams.some(s => s.code === ex.code);
                container.appendChild(createRow(ex, isSaved));
            });
        }

        function addToCal(code, dateStr, timeStr) {
            // معالجة التاريخ: 29-03-2026 -> 20260329
            const datePart = dateStr.split(' ')[0].split('-').reverse().join('');
            
            // معالجة الوقت: "09:40 AM - 10:40 AM" -> بدايه 094000
            const times = timeStr.split(' - ');
            const formatTime = (t) => {
                let [h, m] = t.split(':');
                m = m.substring(0,2);
                if(t.includes('PM') && h !== '12') h = parseInt(h) + 12;
                if(t.includes('AM') && h === '12') h = '00';
                return h.toString().padStart(2, '0') + m + '00';
            };

            const start = datePart + 'T' + formatTime(times[0]);
            const end = datePart + 'T' + formatTime(times[1]);
            
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=اختبار ${code}&dates=${start}/${end}&details=مع تمنياتنا لكم بالتوفيق - نظام YIC`;
            window.open(url, '_blank');
        }

        function updateCountdown(dateStr) {
            const datePart = dateStr.split(' ')[0];
            const [d, m, y] = datePart.split('-');
            const diff = dayjs(`${y}-${m}-${d}`).diff(dayjs().startOf('day'), 'day');
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            el.innerHTML = diff > 0 ? `⏳ متبقي ${diff} أيام على أول اختبار لك (${datePart})` : 
                           diff === 0 ? `🔥 اختبارك اليوم! بالتوفيق` : `✅ انتهت اختباراتك`;
        }

        function downloadSchedule() {
            const element = document.getElementById('myScheduleSection');
            html2canvas(element, { backgroundColor: '#050816', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-schedule-yic.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        document.getElementById('studentId').addEventListener('input', doSearch);
        init();
    </script>
</body>
</html>
