<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>YIC Smart Exams - نظام الجداول الذكي</title>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&family=Rubik:wght@300;500;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

  <style>
    :root { --anim-speed: 0.4s; }

    body {
      margin: 0; background: #050816; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Tajawal', sans-serif; transition: background 0.5s ease;
      overflow-x: hidden;
    }

    /* تأثير الخلفية المتطور */
    .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
    .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.15; animation: move 20s infinite alternate; }
    @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

    /* الكارد الرئيسي */
    .app {
      width: min(920px, 95%);
      background: rgba(13, 23, 56, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      overflow: hidden; animation: fadeIn 0.8s ease-out;
      margin: 20px 0;
    }

    /* نظام العداد التنازلي */
    .countdown-bar {
      background: linear-gradient(90deg, #ff4d6d, #8042ff);
      color: white; padding: 10px; text-align: center;
      font-size: 13px; font-weight: bold; display: none;
    }

    /* شكل الصفوف */
    .row {
      display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.8fr 0.8fr;
      gap: 12px; padding: 15px; margin-bottom: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      color: white; align-items: center;
    }
    .row:hover {
      transform: scale(1.02) translateY(-5px);
      background: rgba(255,255,255,0.08);
      border-color: #8042ff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .btn-cal {
      background: rgba(31, 196, 124, 0.15); color: #1fc47c; border: 1px solid #1fc47c;
      padding: 5px 10px; border-radius: 10px; font-size: 11px; cursor: pointer; transition: 0.2s;
    }
    .btn-cal:hover { background: #1fc47c; color: white; }

    .theme-1 { --primary: #2734fe; --accent: #1fc47c; }
    .theme-2 { --primary: #007BFF; --accent: #ffd166; }
    .theme-3 { --primary: #cb3cff; --accent: #00c2ff; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr 1fr; gap: 10px; }
      .cell.venue, .cell.cal-btn { display: none; }
      .app { border-radius: 0; width: 100%; margin: 0; min-height: 100vh; }
    }
  </style>
</head>
<body class="theme-1" id="appRoot">

  <div class="bg-blobs">
    <div id="blob1" class="blob" style="width:400px; height:400px; background:#2734fe; top:-100px; right:-100px;"></div>
    <div id="blob2" class="blob" style="width:300px; height:300px; background:#1fc47c; bottom:-50px; left:-50px;"></div>
  </div>

  <main class="app">
    <div id="countdown" class="countdown-bar"></div>
    
    <header class="top" style="padding: 30px; text-align: center;">
      <h1 style="font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 10px;">
        جداول الكلية الذكية
        <span style="font-size: 12px; background: #8042ff; padding: 4px 12px; border-radius: 20px;">V2.0 PRO</span>
      </h1>

      <div class="controls" style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
        <div class="search-wrapper" style="width: 100%; max-width: 400px; position: relative;">
          <input id="studentId" type="text" placeholder="ابحث برمز المادة أو اسمها..." 
                 style="width: 100%; padding: 15px 25px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; outline: none;">
          <button id="searchBtn" style="position: absolute; left: 5px; top: 5px; bottom: 5px; width: 50px; border-radius: 50px; background: #8042ff; border: none; color: white; cursor: pointer;">
            <i class="fa fa-search"></i>
          </button>
        </div>
        
        <button id="themeSwitch" style="background: transparent; color: #aaa; border: none; cursor: pointer; font-size: 12px;">
           <i class="fa fa-magic"></i> تبديل مظهر النظام
        </button>
      </div>
    </header>

    <section class="results-wrap" style="padding: 20px;">
      <div id="rows" class="r-body">
        <div class="empty" style="text-align: center; color: #666; padding: 40px;">
          <i class="fa fa-calendar-alt" style="font-size: 50px; margin-bottom: 20px; display: block;"></i>
          جاري تجهيز الاتصال بملف البيانات...
        </div>
      </div>
    </section>

    <footer style="padding: 20px; text-align: center; font-size: 11px; color: #444; border-top: 1px solid rgba(255,255,255,0.05);">
      Designed with Intelligence for YIC Students
    </footer>
  </main>

  <script>
    let examsData = []; // هنا سيتم تخزين البيانات من ملف JSON
    const elRows = document.getElementById('rows');
    const studentInput = document.getElementById('studentId');

    // 1. جلب البيانات من ملف JSON
    async function loadExamsData() {
        try {
            const response = await fetch('exams_data.json');
            if (!response.ok) throw new Error();
            examsData = await response.json();
            elRows.innerHTML = `
                <div class="empty" style="text-align: center; color: #666; padding: 40px;">
                    <i class="fa fa-check-circle" style="font-size: 50px; color: #1fc47c; margin-bottom: 20px; display: block;"></i>
                    تم تحميل البيانات بنجاح! ابحث الآن عن موادك.
                </div>`;
        } catch (e) {
            elRows.innerHTML = '<div class="empty" style="color:#ff4d6d;">فشل الاتصال بملف exams_data.json</div>';
        }
    }

    // 2. منطق البحث
    function doSearch() {
      const query = studentInput.value.trim().toUpperCase();
      if (!query) return;

      const filtered = examsData.filter(ex => 
        ex.code.toUpperCase().includes(query) || 
        ex.name.toUpperCase().includes(query)
      );

      renderAdvancedRows(filtered);
    }

    // 3. عرض الصفوف بالتصميم الرهيب
    function renderAdvancedRows(exams) {
      if (exams.length === 0) {
        elRows.innerHTML = '<div class="empty">لا توجد نتائج مطابقة لبحثك.</div>';
        return;
      }

      elRows.innerHTML = '';
      exams.forEach((ex) => {
        const row = document.createElement('div');
        row.className = 'row';

        row.innerHTML = `
          <div class="cell">
            <div style="color: #ffd166; font-weight: 900;">${ex.code}</div>
            <div style="font-size: 11px; opacity: 0.7;">${ex.name}</div>
          </div>
          <div class="cell" style="text-align: center;">
            <div style="font-size: 14px;">${ex.date}</div>
            <div style="color: #1fc47c; font-size: 12px;">Exam Day</div>
          </div>
          <div class="cell">
            <div style="color: #ff4d6d; font-size: 13px;">${ex.time}</div>
          </div>
          <div class="cell venue">القاعة: 102</div>
          <div class="cell cal-btn" style="text-align: left;">
            <button class="btn-cal" onclick='addToGoogleCalendar(${JSON.stringify(ex)})'>
              <i class="fa fa-plus"></i> تقويم
            </button>
          </div>
        `;
        elRows.appendChild(row);
      });

      // تحديث العداد لأول نتيجة تظهر
      if(exams[0].date) updateCountdown(exams[0].date);
    }

    function addToGoogleCalendar(exam) {
      const title = `اختبار: ${exam.code}`;
      const d = exam.date.split('-').reverse().join(''); // YYYYMMDD
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${d}/${d}`;
      window.open(url, '_blank');
    }

    function updateCountdown(dateStr) {
      const countdownEl = document.getElementById('countdown');
      // تحويل DD-MM-YYYY إلى format يفهمه dayjs
      const parts = dateStr.split('-');
      const target = dayjs(`${parts[2]}-${parts[1]}-${parts[0]}`);
      const diff = target.diff(dayjs(), 'day');

      if (diff >= 0) {
        countdownEl.style.display = 'block';
        countdownEl.innerHTML = `🚀 متبقي ${diff} أيام على اختبار ${dateStr} ! شد حيلك.`;
      }
    }

    // الأزرار والـ Theme Switcher
    studentInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
    document.getElementById('searchBtn').onclick = doSearch;

    let currentTheme = 1;
    document.getElementById('themeSwitch').onclick = () => {
      currentTheme = currentTheme >= 3 ? 1 : currentTheme + 1;
      document.body.className = `theme-${currentTheme}`;
      const colors = ['#2734fe', '#007BFF', '#cb3cff'];
      document.getElementById('blob1').style.background = colors[currentTheme-1];
    };

    // تشغيل جلب البيانات عند البداية
    loadExamsData();

  </script>
</body>
</html>
