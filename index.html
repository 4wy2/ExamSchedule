<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

    <style>
        :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; --bg: #050816; --row-bg: rgba(255, 255, 255, 0.04); }
        body { margin: 0; background: var(--bg); font-family: 'Tajawal', sans-serif; color: white; overflow-x: hidden; }
        
        .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .app { width: min(920px, 96%); margin: 15px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }

        .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 8px; text-align: center; font-weight: bold; display: none; font-size: 11px; }

        .section-title { padding: 12px 15px 5px; font-size: 13px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

        /* حاوية الجدول */
        .table-container { padding: 5px 10px 15px; }

        /* رأس الجدول (العناوين المثبتة) */
        .table-header { 
            display: flex; 
            padding: 10px 8px; 
            background: rgba(128, 66, 255, 0.15); 
            border-radius: 10px; 
            margin-bottom: 8px;
            border: 1px solid rgba(128, 66, 255, 0.2);
        }
        .header-item { 
            font-size: 10px; 
            font-weight: 800; 
            color: var(--primary); 
            text-align: center; 
            flex: 1; 
        }

        /* تصميم الصفوف */
        .row { 
            display: flex; 
            align-items: center; 
            padding: 12px 8px; 
            margin-bottom: 6px; 
            background: var(--row-bg); 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.03); 
            transition: 0.3s;
        }
        .row:hover { background: rgba(255, 255, 255, 0.07); border-color: var(--primary); }

        /* توزيع الأعمدة بالتساوي */
        .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-width: 0; }
        
        /* تخصيص مساحة رمز المادة لتكون أكبر قليلاً */
        .col-code { flex: 1.2; align-items: flex-start; text-align: right; }

        .val-main { font-weight: 800; font-size: 12px; white-space: nowrap; }
        .val-sub { font-size: 9px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        /* ألوان النصوص */
        .code-text { color: #ffd166; }
        .time-text { color: var(--danger); font-size: 11px; }
        .date-sub { color: var(--accent); }

        /* الأزرار */
        .col-actions { flex: 0.8; flex-direction: row; gap: 5px; justify-content: flex-end; }
        .btn-action { 
            border: none; width: 30px; height: 30px; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; cursor: pointer; transition: 0.2s; 
        }
        .btn-save { background: rgba(255, 77, 109, 0.1); color: var(--danger); border: 1px solid rgba(255, 77, 109, 0.2); }
        .btn-save.saved { background: var(--danger); color: white; border: none; }
        .btn-cal { background: rgba(31, 196, 124, 0.1); color: var(--accent); border: 1px solid rgba(31, 196, 124, 0.2); }

        .search-wrapper { padding: 25px 15px; text-align: center; }
        .search-wrapper input { width: 100%; max-width: 450px; padding: 14px 25px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: white; outline: none; font-size: 15px; }

        @media (max-width: 500px) {
            .val-main { font-size: 10px; }
            .val-sub { font-size: 8px; }
            .header-item { font-size: 9px; }
            .row { padding: 10px 5px; }
            .btn-action { width: 26px; height: 26px; font-size: 11px; }
            .col-actions { flex: 0.6; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob" style="width:300px; height:300px; background:var(--primary); top:-50px; right:-50px;"></div>
        <div class="blob" style="width:250px; height:250px; background:var(--accent); bottom:-30px; left:-30px;"></div>
    </div>

    <main class="app">
        <div id="countdown" class="countdown-bar"></div>

        <div class="search-wrapper">
            <h2 style="font-weight: 900; margin-bottom: 10px;">جداول YIC الذكية</h2>
            <input id="studentId" type="text" placeholder="ابحث عن مادتك...">
        </div>

        <div id="myScheduleSection" style="display:none;">
            <div class="section-title"><i class="fa fa-star" style="color: #ffd166;"></i> جدولي الشخصي</div>
            <div class="table-container">
                <div class="table-header">
                    <div class="header-item" style="flex: 1.2; text-align: right;">المادة</div>
                    <div class="header-item">التاريخ</div>
                    <div class="header-item">الوقت</div>
                    <div class="header-item" style="flex: 0.8; text-align: left; padding-left: 10px;">إجراء</div>
                </div>
                <div id="myRows"></div>
            </div>
        </div>

        <div class="section-title"><i class="fa fa-search"></i> نتائج البحث</div>
        <div class="table-container">
            <div id="searchHeader" class="table-header" style="display:none;">
                <div class="header-item" style="flex: 1.2; text-align: right;">المادة</div>
                <div class="header-item">التاريخ</div>
                <div class="header-item">الوقت</div>
                <div class="header-item" style="flex: 0.8; text-align: left; padding-left: 10px;">إجراء</div>
            </div>
            <div id="searchRows"></div>
        </div>
    </main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_exams')) || [];

        async function init() {
            try {
                const res = await fetch('exams_data.json?v=' + Date.now());
                const data = await res.json();
                allExams = data.exams_list;
                syncExams();
                renderMySchedule();
            } catch(e) { console.error("Error:", e); }
        }

        function syncExams() {
            myExams = myExams.map(saved => {
                const latest = allExams.find(e => e.code === saved.code);
                return latest || saved;
            });
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
        }

        function createRow(ex, isSaved) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <div class="col col-code">
                    <span class="val-main code-text">${ex.code}</span>
                    <span class="val-sub">${ex.course_name}</span>
                </div>
                <div class="col">
                    <span class="val-main">${ex.date.split(' ')[0]}</span>
                    <span class="val-sub date-sub">${ex.date.split(' ')[1] || ''}</span>
                </div>
                <div class="col">
                    <span class="val-main time-text">${ex.time}</span>
                    <span class="val-sub">${ex.duration || ''}</span>
                </div>
                <div class="col col-actions">
                    <button class="btn-action btn-cal" onclick="addToCal('${ex.code}','${ex.date}','${ex.time}')"><i class="fa fa-calendar-plus"></i></button>
                    <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')"><i class="fa ${isSaved ? 'fa-trash-can' : 'fa-bookmark'}"></i></button>
                </div>
            `;
            return row;
        }

        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('myScheduleSection');
            if (myExams.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            container.innerHTML = '';
            myExams.sort((a,b) => a.date.localeCompare(b.date)).forEach(ex => container.appendChild(createRow(ex, true)));
            updateCountdown(myExams[0].date);
        }

        function toggleSave(code) {
            const idx = myExams.findIndex(e => e.code === code);
            if (idx > -1) myExams.splice(idx, 1);
            else myExams.push(allExams.find(e => e.code === code));
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
            renderMySchedule(); doSearch();
        }

        function doSearch() {
            const q = document.getElementById('studentId').value.trim().toUpperCase();
            const container = document.getElementById('searchRows');
            const header = document.getElementById('searchHeader');
            if (!q) { container.innerHTML = ''; header.style.display = 'none'; return; }
            const filtered = allExams.filter(e => e.code.includes(q) || e.course_name.toUpperCase().includes(q));
            container.innerHTML = '';
            if (filtered.length > 0) {
                header.style.display = 'flex';
                filtered.forEach(ex => container.appendChild(createRow(ex, myExams.some(s => s.code === ex.code))));
            } else {
                header.style.display = 'none';
                container.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">لا توجد نتائج</div>';
            }
        }

        function updateCountdown(dateStr) {
            const datePart = dateStr.split(' ')[0];
            const [d, m, y] = datePart.split('-');
            const diff = dayjs(`${y}-${m}-${d}`).diff(dayjs().startOf('day'), 'day');
            const el = document.getElementById('countdown');
            if (diff >= 0) {
                el.style.display = 'block';
                el.innerHTML = `🚀 متبقي ${diff} أيام على اختبارك القادم (${datePart})`;
            } else el.style.display = 'none';
        }

        function addToCal(code, dateStr, timeStr) {
            const d = dateStr.split(' ')[0].split('-').reverse().join('');
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=اختبار ${code}&dates=${d}T080000/${d}T100000`, '_blank');
        }

        document.getElementById('studentId').addEventListener('input', doSearch);
        init();
    </script>
</body>
</html>
