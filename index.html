<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Exams - Pro Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        :root { --primary: #8042ff; --accent: #1fc47c; --danger: #ff4d6d; --bg: #050816; }
        body { margin: 0; background: var(--bg); font-family: 'Tajawal', sans-serif; color: white; direction: rtl; }
        
        /* شريط التشجيع والعد التنازلي */
        .countdown-banner { 
            background: linear-gradient(135deg, #6227d7 0%, #8042ff 100%);
            padding: 15px; text-align: center; font-weight: 800; border-radius: 15px;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: none; /* يظهر فقط إذا فيه مواد محفوظة */
        }
        .countdown-banner i { margin-left: 8px; color: #ffd166; }

        .app { width: min(920px, 96%); margin: 15px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; padding-bottom: 20px; }

        .search-wrapper { padding: 25px 15px; text-align: center; background: rgba(255,255,255,0.02); }
        .search-wrapper input { width: 100%; max-width: 450px; padding: 15px 25px; border-radius: 50px; border: 2px solid var(--primary); background: rgba(0,0,0,0.4); color: white; outline: none; font-size: 16px; transition: 0.3s; }
        .search-wrapper input:focus { box-shadow: 0 0 15px var(--primary); }

        .section-title { padding: 20px 20px 10px; font-size: 15px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 10px; }

        /* تنسيق الجدول */
        .table-container { padding: 0 15px; }
        .table-header { display: flex; padding: 12px 10px; background: rgba(128, 66, 255, 0.2); border-radius: 12px; margin-bottom: 10px; font-size: 11px; font-weight: 800; color: #ccc; }
        
        .row { display: flex; align-items: center; padding: 12px 10px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .row:hover { background: rgba(255,255,255,0.08); }

        .col { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .col-code { flex: 1.5; }
        .col-time { flex: 1.2; }
        .col-actions { flex: 0.7; flex-direction: row; gap: 8px; justify-content: flex-end; }

        .val-main { font-weight: 800; font-size: 13px; color: #fff; }
        .val-sub { font-size: 10px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .code-text { color: #ffd166; font-size: 14px; }

        .btn-action { border: none; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .btn-save { background: rgba(255, 77, 109, 0.15); color: var(--danger); }
        .btn-save.saved { background: var(--danger); color: white; }
        .btn-cal { background: rgba(31, 196, 124, 0.15); color: var(--accent); }

        @media (max-width: 600px) {
            .val-main { font-size: 11px; }
            .val-sub { display: none; }
            .col-code { flex: 1; }
            .btn-action { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <main class="app">
        <div class="search-wrapper">
            <div id="countdownBanner" class="countdown-banner"></div>
            <h2 style="margin:0 0 15px 0; font-weight: 900; letter-spacing: 1px;">YIC EXAM TRACKER</h2>
            <input id="searchInput" type="text" placeholder="ابحث برمز المادة (مثال: EE 301)..." autocomplete="off">
        </div>

        <div id="mySection" style="display:none;">
            <div class="section-title"><i class="fa fa-star"></i> موادي المختارة</div>
            <div class="table-container">
                <div id="myRows"></div>
            </div>
        </div>

        <div class="section-title"><i class="fa fa-list"></i> جميع الاختبارات</div>
        <div class="table-container">
            <div class="table-header">
                <div style="flex:1.5;">المادة</div>
                <div style="flex:1;">التاريخ</div>
                <div style="flex:1.2;">الوقت</div>
                <div style="flex:0.7; text-align:left;">حفظ</div>
            </div>
            <div id="searchRows"></div>
        </div>
    </main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_v2')) || [];

        async function init() {
            // ملاحظة: استبدل 'exams.json' باسم ملفك الحقيقي
            try {
                const res = await fetch('exams_data.json'); 
                const data = await res.json();
                allExams = data.exams_list || [];
                renderAll();
                renderMySchedule();
            } catch (e) {
                console.error("لم يتم العثور على ملف الـ JSON");
            }
        }

        function renderAll() {
            const q = document.getElementById('searchInput').value.trim().toUpperCase();
            const container = document.getElementById('searchRows');
            container.innerHTML = '';

            const filtered = allExams.filter(e => 
                e.code.toUpperCase().includes(q) || 
                e.course_name.toUpperCase().includes(q)
            );

            filtered.forEach(ex => {
                const isSaved = myExams.some(s => s.code === ex.code);
                container.appendChild(createRow(ex, isSaved));
            });
        }

        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('mySection');
            const banner = document.getElementById('countdownBanner');
            
            if (myExams.length === 0) {
                section.style.display = 'none';
                banner.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';
            
            // ترتيب المواد المحفوظة حسب التاريخ الأقرب
            myExams.sort((a, b) => parseDate(a.date) - parseDate(b.date));
            
            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            
            // تحديث شريط التشجيع لأقرب اختبار
            showMotivation(myExams[0]);
        }

        function createRow(ex, isSaved) {
            const div = document.createElement('div');
            div.className = 'row';
            div.innerHTML = `
                <div class="col col-code">
                    <span class="val-main code-text">${ex.code}</span>
                    <span class="val-sub">${ex.course_name}</span>
                </div>
                <div class="col">
                    <span class="val-main">${ex.date.split(' ')[0]}</span>
                </div>
                <div class="col col-time">
                    <span class="val-main" style="color:var(--danger)">${ex.time.split(' - ')[0]}</span>
                </div>
                <div class="col col-actions">
                    <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')">
                        <i class="fa ${isSaved ? 'fa-check' : 'fa-plus'}"></i>
                    </button>
                </div>
            `;
            return div;
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) {
                myExams.splice(index, 1);
            } else {
                const exam = allExams.find(e => e.code === code);
                if (exam) myExams.push(exam);
            }
            localStorage.setItem('yic_saved_v2', JSON.stringify(myExams));
            renderMySchedule();
            renderAll();
        }

        // دالة ذكية لتحويل تاريخ ملفك (29-03-2026) إلى تاريخ يفهمه الكمبيوتر
        function parseDate(dateStr) {
            const cleanDate = dateStr.split(' ')[0]; // يأخذ "29-03-2026" ويترك "(Sun)"
            const [d, m, y] = cleanDate.split('-');
            return new Date(y, m - 1, d);
        }

        function showMotivation(nextExam) {
            const banner = document.getElementById('countdownBanner');
            const target = parseDate(nextExam.date);
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            banner.style.display = 'block';
            if (diffDays > 0) {
                banner.innerHTML = `<i class="fa fa-fire"></i> هانت! باقي <span>${diffDays}</span> أيام على اختبار <b>${nextExam.code}</b>. شد حيلك يا بطل!`;
            } else if (diffDays === 0) {
                banner.innerHTML = `<i class="fa fa-rocket"></i> اليوم هو يوم الحصاد! فالك التوفيق في اختبار <b>${nextExam.code}</b>`;
            } else {
                banner.innerHTML = `<i class="fa fa-medal"></i> انتهى اختبار ${nextExam.code}، عساك أبدعت!`;
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderAll);
        init();
    </script>
</body>
</html>
