<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YIC Smart Exams - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/plugin/customParseFormat.min.js"></script>
    <script>dayjs.extend(window.dayjs_plugin_customParseFormat);</script>

    <style>
    :root { 
        --primary: #8042ff; 
        --accent: #1fc47c; 
        --danger: #ff4d6d; 
        --bg: #050816; 
    }
    body { margin: 0; background: var(--bg); font-family: 'Tajawal', sans-serif; color: white; overflow-x: hidden; }
    
    .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
    .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.1; animation: move 20s infinite alternate; }
    
    .app { width: min(950px, 98%); margin: 20px auto; background: rgba(13, 23, 56, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
    .countdown-bar { background: linear-gradient(90deg, var(--danger), var(--primary)); padding: 12px; text-align: center; font-weight: 800; font-size: 13px; }
    
    .search-wrapper { padding: 30px 15px; text-align: center; }
    .search-wrapper input { width: 100%; max-width: 450px; padding: 15px 25px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 15px; }

    .section-title { padding: 20px 20px 5px; font-size: 13px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px; }

    /* إعدادات الجدول الموحد للكمبيوتر والجوال */
    .table-header, .row { 
        display: grid; 
        grid-template-columns: 1.4fr 1fr 1fr 0.7fr 0.4fr; /* نفس تقسيمك المفضل */
        gap: 8px; 
        align-items: center; 
        text-align: center;
    }

    .table-header { 
        padding: 10px 15px; 
        background: rgba(255,255,255,0.05); 
        margin: 10px; 
        border-radius: 10px; 
        font-size: 11px; 
        color: rgba(255,255,255,0.4); 
    }

    .row { 
        padding: 12px 15px; 
        margin: 5px 10px; 
        background: rgba(255,255,255,0.02); 
        border-radius: 12px; 
        border: 1px solid rgba(255,255,255,0.05); 
    }

    .btn-action { border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(128, 66, 255, 0.1); color: #b794ff; margin: 0 auto; }
    .btn-save.saved { background: var(--danger); color: white; }

    /* ضبط الجوال ليبقى أفقياً وواضحاً للتصوير */
    @media (max-width: 600px) {
        .app { width: 100%; margin: 0; border-radius: 0; border: none; }
        .table-header, .row { 
            gap: 4px; 
            padding: 10px 5px; 
            margin: 4px 5px; 
            grid-template-columns: 1.3fr 1fr 1.1fr 0.7fr 0.4fr; /* تعديل بسيط للنسب */
        }
        
        .row .label { font-size: 12px !important; }
        .row .sub { font-size: 7px !important; }
        
        .date-box b { font-size: 11px !important; }
        .date-box small { font-size: 8px !important; }
        
        .time-box div { min-width: auto !important; padding: 2px !important; border-radius: 6px !important; }
        .time-box div div:first-child { font-size: 10px !important; }
        .time-box div div:last-child { font-size: 7px !important; }
        
        .duration-box span { font-size: 9px !important; }
        .btn-action { width: 28px; height: 28px; font-size: 10px; }
    }
</style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob" style="width:500px; height:500px; background:var(--primary); top:-150px; right:-100px;"></div>
        <div class="blob" style="width:400px; height:400px; background:var(--accent); bottom:-100px; left:-50px;"></div>
    </div>

   <main class="app">
    <div id="countdown" class="countdown-bar"></div>
    
    <div class="search-wrapper">
        <h2 style="letter-spacing: -1px;">جداول YIC الذكية <span style="font-size: 10px; background: var(--primary); padding: 3px 10px; border-radius: 8px; vertical-align: middle;">PRO</span></h2>
        <input id="searchInput" type="text" placeholder="ابحث برمز المادة أو اسمها (مثلاً: MATH)...">
    </div>

    <div id="myScheduleSection" style="display:none; margin-bottom: 20px;">
        <div class="section-title">
            <i class="fa-solid fa-star-half-stroke" style="color:#ffd166"></i> 
            جدولك الشخصي
        </div>
        <div class="table-header">
            <div>المادة</div><div>التاريخ</div><div>الوقت</div><div>المدة</div><div>حفظ</div>
        </div>
        <div id="myRows"></div>
    </div>

    <div class="section-title">
        <i class="fa-solid fa-magnifying-glass"></i> 
        نتائج البحث
    </div>
    <div id="searchHeader" class="table-header" style="display:none;">
        <div>المادة</div><div>التاريخ</div><div>الوقت</div><div>المدة</div><div>حفظ</div>
    </div>
    <div id="searchRows">
        <div style="text-align: center; padding: 60px; opacity: 0.3;">
            <i class="fa-solid fa-keyboard" style="display: block; font-size: 30px; margin-bottom: 10px;"></i>
            ابدأ البحث الآن عن اختبارك
        </div>
    </div>
</main>

    <script>
        let allExams = [];
        let myExams = JSON.parse(localStorage.getItem('yic_saved_exams')) || [];

        async function loadData() {
            try {
                const response = await fetch('exams_data.json');
                if (!response.ok) throw new Error('الملف غير موجود');
                const data = await response.json();
                allExams = data.exams_list;
                renderMySchedule();
                document.getElementById('searchRows').innerHTML = '<div style="text-align: center; padding: 60px; opacity: 0.3;">ابدأ البحث الآن عن اختبارك</div>';
            } catch (error) {
                document.getElementById('searchRows').innerHTML = '<div style="text-align: center; padding: 60px; color: var(--danger);">تأكد من وجود ملف exams_data.json</div>';
            }
        }

      function createRow(ex, isSaved) {
    const row = document.createElement('div');
    row.className = 'row';
    
    // 1. منطق الألوان (شغال 100%)
    const testDate = dayjs(ex.date.split(' ')[0], 'DD-MM-YYYY');
    const today = dayjs().startOf('day');
    const diffDays = testDate.diff(today, 'day');

    let statusColor = 'var(--accent)'; 
    if (diffDays === 0) statusColor = 'var(--danger)'; 
    else if (diffDays > 0 && diffDays <= 3) statusColor = '#ff9f43';

    // 2. تعريف أجزاء التاريخ (هنا كان الخطأ)
    const dateParts = ex.date.split(' ');
    const dateNum = dateParts[0] || '';
    const dayName = dateParts[1] ? dateParts[1].replace(/[()]/g, '') : '';

    // 3. معالجة الوقت بدقة
    const timeParts = ex.time.split(/[-–—]/); 
    const startTime = timeParts[0] ? timeParts[0].trim() : ex.time;
    const endTime = timeParts[1] ? timeParts[1].trim() : '';
    
    const isPM = ex.time.toUpperCase().includes('PM');
    const timeColor = isPM ? '#ff9f43' : '#00d2d3';

    row.innerHTML = `
        <div class="info-group" style="text-align: right; display: flex; flex-direction: column; justify-content: center; padding-right: 20px; flex: 1.4; overflow: hidden;">
            <span class="label" style="color: #ffd166; font-size: 15px; font-weight: 900; line-height: 1.2; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">
                ${ex.code}
            </span>
            <span class="sub" style="font-size: 9px; opacity: 0.8; font-weight: 500; display: block; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin-top: 2px; color: #fff;">
                ${ex.course_name}
            </span>
        </div>

        <div class="date-box" style="display: flex; justify-content: center; align-items: center; gap: 6px; flex: 1; border-right: 1px solid rgba(255,255,255,0.05);">
            <div style="text-align: left;">
                <b style="display: block; font-size: 11px; color: #fff; line-height: 1;">${dateNum}</b>
                <small style="font-size: 9px; color: ${statusColor}; font-weight: 800; display: block; text-align: right;">${dayName}</small>
            </div>
            <div style="width: 2px; height: 16px; background: ${statusColor}; opacity: 0.6; border-radius: 10px;"></div>
        </div>

        <div class="time-box" style="display: flex; justify-content: center; align-items: center; flex: 1.1;">
            <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 4px 6px; border-radius: 8px; width: 100%; max-width: 85px; text-align: center;">
                <div style="font-size: 10px; font-weight: 800; color: ${timeColor}; line-height: 1;">${startTime}</div>
                ${endTime ? `<div style="font-size: 8px; opacity: 0.3; margin-top: 2px;">${endTime}</div>` : ''}
            </div>
        </div>

        <div class="duration-box" style="text-align: center; display: flex; flex-direction: column; justify-content: center; flex: 0.7;">
            <span style="font-size: 10px; font-weight: 700; color: #eee; display: block;">
                ${ex.duration.replace(' H ', 'س ').replace(' M', 'د')}
            </span>
            <span style="font-size: 8px; opacity: 0.3; display: block;">${ex.actual_size} ط</span>
        </div>

        <div class="actions" style="display: flex; justify-content: center; align-items: center; flex: 0.4;">
            <button class="btn-action btn-save ${isSaved ? 'saved' : ''}" onclick="toggleSave('${ex.code}')" style="box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 30px; height: 30px;">
                <i class="fa-solid ${isSaved ? 'fa-xmark' : 'fa-plus'}"></i>
            </button>
        </div>
    `;
    return row;
}
        
        function renderMySchedule() {
            const container = document.getElementById('myRows');
            const section = document.getElementById('myScheduleSection');
            if (myExams.length === 0) { section.style.display = 'none'; return; }

            section.style.display = 'block';
            container.innerHTML = '';
            myExams.forEach(ex => container.appendChild(createRow(ex, true)));
            updateCountdown(myExams[0].date);
        }

        function doSearch() {
            // معالجة نص البحث: تحويل لصغير وإزالة كل المسافات
            const q = document.getElementById('searchInput').value.toLowerCase().replace(/\s+/g, '');
            const container = document.getElementById('searchRows');
            const header = document.getElementById('searchHeader');
            
            if (!q) {
                container.innerHTML = '<div style="text-align: center; padding: 60px; opacity: 0.3;">ابدأ البحث الآن عن اختبارك</div>';
                header.style.display = 'none';
                return;
            }

            const filtered = allExams.filter(e => {
                const codeSafe = e.code.toLowerCase().replace(/\s+/g, '');
                const nameSafe = e.course_name.toLowerCase().replace(/\s+/g, '');
                return codeSafe.includes(q) || nameSafe.includes(q);
            });

            container.innerHTML = '';
            if (filtered.length > 0) {
                header.style.display = 'grid';
                filtered.forEach(ex => {
                    const isSaved = myExams.some(s => s.code === ex.code);
                    container.appendChild(createRow(ex, isSaved));
                });
            } else {
                header.style.display = 'none';
                container.innerHTML = '<div style="text-align: center; padding: 40px; opacity: 0.5;">لا توجد نتائج مطابقة</div>';
            }
        }

        function toggleSave(code) {
            const index = myExams.findIndex(e => e.code === code);
            if (index > -1) myExams.splice(index, 1);
            else {
                const exam = allExams.find(e => e.code === code);
                if (exam) myExams.push(exam);
            }
            localStorage.setItem('yic_saved_exams', JSON.stringify(myExams));
            renderMySchedule();
            doSearch();
        }

        function updateCountdown(dateStr) {
            const target = dayjs(dateStr.split(' ')[0], 'DD-MM-YYYY');
            const diff = target.diff(dayjs().startOf('day'), 'day');
            const el = document.getElementById('countdown');
            el.style.display = 'block';
            if (diff > 0) el.innerText = `🚀 متبقي ${diff} أيام على اختبارك القادم (${dateStr.split(' ')[0]})`;
            else if (diff === 0) el.innerText = `🔥 اختبارك اليوم! فالك التوفيق`;
            else el.innerText = `✅ انتهت الاختبارات المضافة`;
        }

        document.getElementById('searchInput').addEventListener('input', doSearch);
        window.onload = loadData;
    </script>
</body>
</html>
