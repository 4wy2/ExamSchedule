<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>YIC Smart Exams - نظام الجداول الذكي</title>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&family=Rubik:wght@300;500;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.7/dayjs.min.js"></script>

  <style>
    :root { --primary: #8042ff; --accent: #1fc47c; }
    body {
      margin: 0; background: #050816; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Tajawal', sans-serif; overflow-x: hidden;
    }

    /* تأثيرات الخلفية */
    .bg-blobs { position: fixed; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
    .blob { position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.15; animation: move 20s infinite alternate; }
    @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

    .app {
      width: min(920px, 95%);
      background: rgba(13, 23, 56, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
      overflow: hidden; margin: 20px 0;
    }

    /* شريط "كم باقي" المطور */
    .countdown-bar {
      background: linear-gradient(90deg, #ff4d6d, #8042ff);
      color: white; padding: 12px; text-align: center;
      font-size: 14px; font-weight: 800; display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      animation: slideDown 0.5s ease;
    }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

    .row {
      display: grid; grid-template-columns: 1.2fr 1fr 1fr 0.6fr 0.6fr;
      gap: 12px; padding: 15px; margin-bottom: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px; transition: 0.3s;
      color: white; align-items: center; border: 1px solid transparent;
    }
    .row:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--primary);
      transform: scale(1.01);
    }

    .btn-cal {
      background: rgba(31, 196, 124, 0.15); color: #1fc47c; border: 1px solid #1fc47c;
      padding: 6px 12px; border-radius: 12px; font-size: 11px; cursor: pointer; transition: 0.2s;
    }
    .btn-cal:hover { background: #1fc47c; color: white; }

    .controls input {
      width: 100%; padding: 15px 25px; border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
      color: white; outline: none; box-sizing: border-box;
    }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr 1fr; }
      .cell.hide-mobile { display: none; }
      .app { border-radius: 0; width: 100%; margin: 0; min-height: 100vh; }
    }
  </style>
</head>
<body class="theme-1">

  <div class="bg-blobs">
    <div id="blob1" class="blob" style="width:400px; height:400px; background:#2734fe; top:-100px; right:-100px;"></div>
    <div id="blob2" class="blob" style="width:300px; height:300px; background:#1fc47c; bottom:-50px; left:-50px;"></div>
  </div>

  <main class="app">
    <div id="countdown" class="countdown-bar"></div>
    
    <header style="padding: 30px; text-align: center;">
      <h1 style="color: #fff; font-size: 26px; font-weight: 900; margin-bottom: 15px;">
        نظام جداول YIC الذكي
        <span style="font-size: 10px; background: var(--primary); padding: 3px 10px; border-radius: 10px; vertical-align: middle;">V2.1</span>
      </h1>

      <div class="search-wrapper" style="max-width: 450px; margin: 0 auto; position: relative;">
        <input id="studentId" type="text" placeholder="ابحث برمز المادة (مثلاً: GSMA101) أو اسمها...">
        <button id="searchBtn" style="position: absolute; left: 8px; top: 8px; bottom: 8px; width: 45px; border-radius: 50px; background: var(--primary); border: none; color: white; cursor: pointer;">
          <i class="fa fa-search"></i>
        </button>
      </div>
    </header>

    <section id="results" style="padding: 0 20px 20px;">
      <div id="rows">
        <div style="text-align: center; color: #555; padding: 40px;">
          <i class="fa fa-database" style="font-size: 40px; margin-bottom: 15px;"></i>
          <p>جاري انتظار البحث في قاعدة البيانات...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let examsData = [];
    const elRows = document.getElementById('rows');
    const studentInput = document.getElementById('studentId');
    const countdownEl = document.getElementById('countdown');

    // 1. جلب البيانات من ملف JSON حسب الترتيب الجديد
    async function loadData() {
      try {
        const response = await fetch('exams_data.json');
        const data = await response.json();
        // الوصول للمصفوفة الصحيحة حسب الملف المرسل
        examsData = data.exams_list; 
        console.log("Data Loaded:", examsData.length, "exams found.");
      } catch (e) {
        elRows.innerHTML = '<p style="color:red; text-align:center;">خطأ: تأكد من ملف الـ JSON</p>';
      }
    }

    // 2. تحديث عداد "كم باقي"
    function updateCountdown(dateStr) {
      if (!dateStr) return;
      
      // استخراج التاريخ فقط (تجاهل الأيام المكتوبة بين قوسين)
      const datePart = dateStr.split(' ')[0]; // تأخذ 29-03-2026
      const [d, m, y] = datePart.split('-');
      
      const targetDate = dayjs(`${y}-${m}-${d}`);
      const today = dayjs().startOf('day');
      const diff = targetDate.diff(today, 'day');

      countdownEl.style.display = 'block';
      
      if (diff > 0) {
        countdownEl.innerHTML = `⏳ متبقي <span style="font-size: 18px;">${diff}</span> أيام على اختبارك القادم (${datePart})`;
      } else if (diff === 0) {
        countdownEl.innerHTML = `🔥 اختبارك القادم اليوم! شد حيلك وفالك التوفيق.`;
      } else {
        countdownEl.innerHTML = `✅ انتهى موعد الاختبار المختار.`;
      }
    }

    // 3. عرض النتائج
    function renderExams(list) {
      if (list.length === 0) {
        elRows.innerHTML = '<p style="text-align:center; color:#aaa;">لا يوجد نتائج مطابقة</p>';
        countdownEl.style.display = 'none';
        return;
      }

      elRows.innerHTML = '';
      list.forEach(ex => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div class="cell">
            <div style="color: #ffd166; font-weight: 800;">${ex.code}</div>
            <div style="font-size: 11px; opacity: 0.7;">${ex.course_name}</div>
          </div>
          <div class="cell" style="text-align: center;">
            <div style="font-size: 13px;">${ex.date.split(' ')[0]}</div>
            <div style="color: var(--accent); font-size: 11px;">${ex.date.split(' ')[1] || ''}</div>
          </div>
          <div class="cell">
            <div style="color: #ff4d6d; font-size: 12px;">${ex.time}</div>
            <div style="font-size: 10px; opacity: 0.5;">المدة: ${ex.duration}</div>
          </div>
          <div class="cell hide-mobile" style="font-size: 11px; opacity: 0.8;">
            <i class="fa fa-users"></i> ${ex.actual_size} طالب
          </div>
          <div class="cell" style="text-align: left;">
            <button class="btn-cal" onclick="addToCal('${ex.code}', '${ex.date}')">
              <i class="fa fa-plus"></i>
            </button>
          </div>
        `;
        elRows.appendChild(row);
      });

      // تشغيل العداد لأول مادة تظهر في القائمة
      updateCountdown(list[0].date);
    }

    function addToCal(code, date) {
      const d = date.split(' ')[0].split('-').reverse().join('');
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=اختبار ${code}&dates=${d}/${d}`;
      window.open(url, '_blank');
    }

    // 4. تنفيذ البحث
    function handleSearch() {
      const q = studentInput.value.trim().toUpperCase();
      if (!q) {
        countdownEl.style.display = 'none';
        return;
      }
      const filtered = examsData.filter(ex => 
        ex.code.toUpperCase().includes(q) || 
        ex.course_name.toUpperCase().includes(q)
      );
      renderExams(filtered);
    }

    studentInput.addEventListener('input', handleSearch);
    loadData();
  </script>
</body>
</html>
